[package]
# TODO(rename): your crate's name, description and authors.
name = "my-satellite"
version = "0.1.1"
edition = "2024"
rust-version = "1.91"
description = "A Nestor satellite."
license = "MIT"
authors = ["Your Name"]
publish = false

[dependencies]
# The SDK, with WebRTC audio and the machine's microphone and speaker (cpal).
nestor-satellite = { version = "0.5", features = ["audio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
gethostname = "1.1.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
